name: Deployment
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  deployment:
    name: Deployment
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    timeout-minutes: 90
    env:
      WRANGLER_ENV: ${{ inputs.target == 'production' && 'prod' || 'staging' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Migrate database
        run: bun --filter @edaya-spark/adaptor-postgres db:migrate
      - name: Deploy API
        run: bun --filter @edaya-spark/api deploy -- --env "$WRANGLER_ENV"
      - name: Deploy student web
        run: bun --filter @edaya-spark/student-web deploy -- --env "$WRANGLER_ENV"
