name: Push
on:
  push:
    branches-ignore: [main, staging]
permissions:
  contents: read
concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-check:
    uses: ./.github/workflows/_quality-check.yml
    with:
      source_ref: ${{ github.sha }}
  unit-test:
    uses: ./.github/workflows/_unit-test.yml
    with:
      source_ref: ${{ github.sha }}
